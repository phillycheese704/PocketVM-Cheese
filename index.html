<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#0b1020" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="PocketVM" />
  <title>PocketVM</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" sizes="180x180" />
  <link rel="icon" href="favicon.ico" sizes="32x32 48x48" />
  <link rel="icon" href="icons/favicon-32.png" type="image/png" sizes="32x32" />
  <link rel="icon" href="icons/icon.svg?v=illustrated-v1" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="boot" class="boot-screen" aria-live="polite">
    <div class="boot-logo">PV</div>
    <div class="boot-title">PocketVM</div>
    <div class="boot-subtitle">Browser computer for iPad</div>
    <div class="boot-bar"><span></span></div>
  </div>

  <main id="desktop" class="desktop" aria-label="PocketVM desktop" hidden>
    <div id="desktop-wallpaper" class="desktop-wallpaper" aria-hidden="true"></div>
    <div id="desktop-icons" class="desktop-icons">
      <button class="desktop-icon" data-open="browser"><span class="desktop-glyph">◎</span><span>Browser</span></button>
      <button class="desktop-icon" data-open="store"><span class="desktop-glyph">▣</span><span>Store</span></button>
      <button class="desktop-icon" data-open="terminal"><span class="desktop-glyph">›_</span><span>Terminal</span></button>
      <button class="desktop-icon" data-open="files"><span class="desktop-glyph">▤</span><span>Files</span></button>
      <button class="desktop-icon" data-open="calculator"><span class="desktop-glyph">＋</span><span>Calculator</span></button>
      <button class="desktop-icon" data-open="notes"><span class="desktop-glyph">✎</span><span>Notes</span></button>
      <button class="desktop-icon" data-open="pocketcode"><span class="desktop-glyph">&lt;&gt;</span><span>Pocket Code</span></button>
      <button class="desktop-icon" data-open="monitor"><span class="desktop-glyph">⌁</span><span>System</span></button>
      <button class="desktop-icon" data-open="taskmanager"><span class="desktop-glyph">▦</span><span>Task Manager</span></button>
      <button class="desktop-icon" data-open="settings"><span class="desktop-glyph">⚙</span><span>Settings</span></button>
    </div>

    <section id="window-layer" class="window-layer" aria-live="polite"></section>

    <div id="start-menu" class="start-menu" hidden>
      <div class="start-search"><span>⌕</span><input id="start-search-input" type="search" autocomplete="off" placeholder="Search apps" aria-label="Search apps" /></div>
      <div class="start-head">
        <div id="start-avatar" class="avatar">G</div>
        <div><strong id="start-user-name">Guest</strong><small>Local PocketVM account</small></div>
      </div>
      <div class="start-grid">
        <button data-open="browser"><span>◎</span>Browser</button>
        <button data-open="store"><span>▣</span>Store</button>
        <button data-open="terminal"><span>›_</span>Terminal</button>
        <button data-open="files"><span>▤</span>Files</button>
        <button data-open="calculator"><span>＋</span>Calculator</button>
        <button data-open="notes"><span>✎</span>Notes</button>
        <button data-open="pocketcode"><span>&lt;&gt;</span>Pocket Code</button>
        <button data-open="monitor"><span>⌁</span>System</button>
        <button data-open="taskmanager"><span>▦</span>Task Manager</button>
        <button data-open="settings"><span>⚙</span>Settings</button>
        <button id="start-about"><span>ⓘ</span>About</button>
      </div>
      <div class="start-foot">
        <button id="lock-btn">Lock</button>
        <button id="restart-btn">Restart</button>
        <button id="shutdown-btn">Shut down</button>
      </div>
    </div>

    <footer class="taskbar">
      <button id="start-btn" class="start-btn" aria-label="Start menu"><span>◈</span></button>
      <div class="task-pins"><button class="task-pin" data-open="browser" title="Browser">◎</button><button class="task-pin" data-open="files" title="Files">▤</button><button class="task-pin" data-open="pocketcode" title="Pocket Code">&lt;&gt;</button><button class="task-pin" data-open="calculator" title="Calculator">＋</button></div>
      <div id="taskbar-apps" class="taskbar-apps"></div>
      <button id="kbd-btn" class="tray-btn" aria-label="Show keyboard">⌨</button>
      <button id="quick-btn" class="tray-btn" aria-label="Quick settings">⌁</button>
      <button id="notify-btn" class="tray-btn notify-btn" aria-label="Notifications">○</button>
      <button id="clock-btn" class="clock-wrap" aria-label="Calendar"><span id="clock">--:--</span><span id="date">----</span></button>
      <button id="show-desktop-btn" class="show-desktop-btn" aria-label="Show desktop" title="Show desktop"></button>
    </footer>

    <div id="quick-panel" class="shell-flyout quick-panel" hidden></div>
    <div id="calendar-panel" class="shell-flyout calendar-panel" hidden></div>
    <div id="notification-center" class="shell-flyout notification-center" hidden></div>
    <div id="desktop-context" class="desktop-context" hidden></div>
    <div id="snap-preview" class="snap-preview" hidden></div>
    <div id="toast-layer" class="toast-layer" aria-live="polite"></div>

    <input id="mobile-keyboard" class="mobile-keyboard" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" inputmode="text" />
  </main>

  <div id="auth-screen" class="auth-screen" hidden>
    <div class="auth-wallpaper" aria-hidden="true"></div>
    <div class="auth-clock">
      <div class="auth-time" id="auth-time">--:--</div>
      <div class="auth-date" id="auth-date">---</div>
    </div>
    <div class="auth-brand" aria-hidden="true">
      <div class="auth-brand-mark">PV</div>
      <div class="auth-brand-copy">
        <strong>PocketVM</strong>
        <span>Local. Private. Yours.</span>
      </div>
    </div>
    <section class="auth-card" aria-live="polite">
      <div id="auth-avatar" class="avatar auth-avatar">G</div>
      <div id="auth-content" class="auth-content"></div>
    </section>
  </div>

  <template id="window-template">
    <article class="window" role="dialog">
      <header class="titlebar">
        <div class="window-title"><span class="window-icon"></span><span class="window-name"></span></div>
        <div class="window-actions">
          <button data-action="minimize" aria-label="Minimize">—</button>
          <button data-action="maximize" aria-label="Maximize">□</button>
          <button data-action="close" class="close" aria-label="Close">×</button>
        </div>
      </header>
      <div class="window-content"></div>
      <div class="resize-handle" aria-hidden="true"></div>
    </article>
  </template>

  <script src="storage.js"></script>
  <script src="files.js"></script>
  <script src="system.js"></script>
  <script src="store.js?v=84"></script>
  <script src="code.js"></script>
  <script src="app.js?v=84"></script>
</body>
</html>
