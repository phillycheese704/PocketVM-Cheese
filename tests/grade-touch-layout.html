<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grade School layout checks</title><style>body{font:14px system-ui;margin:15px;background:#e6ebdf;color:#243e39}header{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:15px}select,button{font:inherit;padding:11px;border-radius:8px;border:1px solid #a3b49d;background:#faf5e6}iframe{display:block;border:1px solid #7d927f;max-width:none}pre{white-space:pre-wrap;line-height:1.5}label{display:flex;gap:8px;align-items:center}</style></head><body><header><label for="viewport">Viewport</label><select id="viewport"><option value="1024,768">iPad landscape · 1024 × 768</option><option value="768,1024">iPad portrait · 768 × 1024</option><option value="1366,1024">iPad Pro · 1366 × 1024</option><option value="507,768">iPad split view · 507 × 768</option><option value="390,844">Phone portrait · 390 × 844</option><option value="320,568">Small phone · 320 × 568</option><option value="740,390">Phone landscape · 740 × 390</option></select><button id="check">Check visible layout</button><span>Play the actual game below; use its settings to change stamp size.</span></header><iframe id="gradeFrame" title="Grade School test" src="../store/gradeschool/game.html?v=school-v2" width="1024" height="768"></iframe><pre id="results">No check yet.</pre><script>
const frame=document.getElementById('gradeFrame'),sizes=document.getElementById('viewport');sizes.addEventListener('change',()=>{const [w,h]=sizes.value.split(',').map(Number);frame.width=w;frame.height=h});document.getElementById('check').addEventListener('click',()=>{const d=frame.contentDocument,w=frame.contentWindow.innerWidth,h=frame.contentWindow.innerHeight,issues=[],visible=e=>e.getBoundingClientRect().width&&e.getBoundingClientRect().height&&!e.closest('[hidden]'),buttons=[...d.querySelectorAll('button')].filter(visible),main=d.getElementById('playArea'),scrolling=main.scrollHeight>main.clientHeight+2;for(const e of buttons){const r=e.getBoundingClientRect();if(r.width<43||r.height<43)issues.push('Small touch target: '+e.textContent.trim());if(r.left<-.5||r.right>w+.5)issues.push('Outside horizontal viewport: '+e.textContent.trim());if(!scrolling&&(r.top<-.5||r.bottom>h+.5))issues.push('Outside vertical viewport: '+e.textContent.trim())}const paper=d.getElementById('paper').getBoundingClientRect(),actions=d.getElementById('actions').getBoundingClientRect();if(actions.top<paper.bottom-1)issues.push('Actions overlap paper');if(!d.getElementById('fatal').hidden)issues.push('Runtime error is visible');document.getElementById('results').textContent=JSON.stringify({viewport:[w,h],extraLarge:d.body.classList.contains('large-controls'),scrolling,buttons:buttons.length,issues,pass:issues.length===0},null,2)});
</script></body></html>
