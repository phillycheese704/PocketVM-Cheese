<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ball vs Ball layout checks</title><style>body{margin:14px;font:14px system-ui;background:#e3e8f1;color:#253c58}header{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:14px}button,select{padding:11px;font:inherit}iframe{display:block;border:1px solid #738da9;max-width:none}pre{white-space:pre-wrap}</style></head><body><header><strong>Ball vs Ball · responsive QA</strong><select id="size" aria-label="Viewport"><option value="390,844">Phone portrait</option><option value="844,390">Phone landscape</option><option value="768,1024">iPad portrait</option><option value="1024,768">iPad landscape</option><option value="1366,768">Laptop</option></select><button id="check">Check current layout</button><button id="run">Run all layouts</button></header><pre id="results">Ready.</pre><iframe id="ballFrame" title="Ball vs Ball responsive test" width="390" height="844" src="../store/ballvsball/game.html?v=ball-v2"></iframe><script>
const f=document.getElementById('ballFrame'),out=document.getElementById('results'),sizes=[[320,640],[360,740],[375,667],[390,844],[430,932],[667,375],[740,360],[844,390],[932,430],[768,1024],[810,1080],[820,1180],[834,1194],[1024,768],[1080,810],[1180,820],[1194,834],[1280,720],[1366,768],[1440,900]],delay=()=>new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
document.getElementById('size').onchange=e=>{const[w,h]=e.target.value.split(',');f.width=w;f.height=h};
function check(state){const d=f.contentDocument,w=f.contentWindow.innerWidth,h=f.contentWindow.innerHeight,issues=[],visible=e=>!!e.getBoundingClientRect().width&&!e.closest('[hidden]');for(const e of d.querySelectorAll('button')){if(!visible(e)||e.closest('.panel-body'))continue;const r=e.getBoundingClientRect();if(r.left<-.1||r.top<-.1||r.right>w+.1||r.bottom>h+.1)issues.push('Button outside viewport: '+e.textContent.trim());}for(const e of d.querySelectorAll('.panel,.choose-card,.menu-card')){if(!visible(e))continue;const r=e.getBoundingClientRect();if(r.left<-.1||r.top<-.1||r.right>w+.1||r.bottom>h+.1)issues.push('Card outside viewport');if(e.scrollWidth>e.clientWidth+2)issues.push('Card overflows horizontally');}if(d.documentElement.scrollWidth>w+1)issues.push('Page overflow');return{width:w,height:h,state,issues};}
document.getElementById('check').onclick=()=>out.textContent=JSON.stringify(check('current'),null,2);
document.getElementById('run').onclick=async()=>{const d=f.contentDocument,results=[];for(const[w,h]of sizes){f.width=w;f.height=h;await delay();results.push(check('menu'));d.getElementById('settings').click();await delay();results.push(check('settings'));d.getElementById('close').click();d.getElementById('collection').click();await delay();results.push(check('collection'));d.getElementById('close').click();d.getElementById('play').click();await delay();results.push(check('choose'));d.querySelector('[data-ball]').click();await delay();results.push(check('aim'));d.getElementById('pause').click();await delay();results.push(check('pause'));d.querySelector('[data-action="exit"]').click();}const failed=results.filter(r=>r.issues.length);out.textContent=JSON.stringify({checks:results.length,passed:results.length-failed.length,failed,results},null,2);};
</script></body></html>
