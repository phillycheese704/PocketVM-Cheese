<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stick War responsive checks</title><style>body{margin:14px;font:14px system-ui;background:#e5e1d3;color:#243329}header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}button,select{padding:11px;font:inherit}iframe{display:block;border:1px solid #7b8979;max-width:none}pre{white-space:pre-wrap;max-height:320px;overflow:auto}</style></head><body><header><strong>Stick War · responsive QA</strong><select id="size" aria-label="Viewport"><option value="320,640">Small phone</option><option value="390,844" selected>Phone portrait</option><option value="844,390">Phone landscape</option><option value="768,1024">iPad portrait</option><option value="1024,768">iPad landscape</option><option value="1366,768">Laptop</option></select><button id="check" disabled>Check current layout</button><button id="run" disabled>Run all layouts</button></header><pre id="results">Ready.</pre><iframe id="stickFrame" title="Stick War responsive test" width="390" height="844" src="../store/stickwar/game.html?v=stick-v3"></iframe><script>
const f=document.getElementById('stickFrame'),out=document.getElementById('results'),sizes=[[320,640],[360,740],[375,667],[390,844],[430,932],[667,375],[740,360],[844,390],[932,430],[768,1024],[810,1080],[820,1180],[834,1194],[1024,768],[1080,810],[1180,820],[1194,834],[1280,720],[1366,768],[1440,900]],delay=()=>new Promise(r=>setTimeout(r,70));
async function fit(w,h){f.width=w;f.height=h;const start=performance.now();while(performance.now()-start<3000){const v=JSON.parse(f.contentDocument?.getElementById('field')?.dataset.viewport||'null');if(v&&v.width===w&&v.height===h)return;await new Promise(r=>setTimeout(r,30));}throw Error('Resize did not finish');}
f.addEventListener('load',()=>{document.getElementById('run').disabled=false;document.getElementById('check').disabled=false;});
document.getElementById('size').onchange=async e=>{const [w,h]=e.target.value.split(',').map(Number);await fit(w,h);};
function check(state){const d=f.contentDocument,w=f.contentWindow.innerWidth,h=f.contentWindow.innerHeight,issues=[],visible=e=>!!e.getBoundingClientRect().width&&!e.closest('[hidden]');for(const e of d.querySelectorAll('button')){if(!visible(e))continue;const r=e.getBoundingClientRect();if(r.left<-.1||r.right>w+.1)issues.push('Button outside width: '+e.textContent.trim());if(!e.closest('.screen')&&(r.top<-.1||r.bottom>h+.1))issues.push('Button outside height: '+e.textContent.trim());if(r.width<32||r.height<24)issues.push('Small control: '+e.textContent.trim());}for(const e of d.querySelectorAll('.screen-inner,.modal,.training,.hud-top')){if(!visible(e))continue;if(e.scrollWidth>e.clientWidth+2)issues.push('Horizontal overflow: '+e.className);}if(d.documentElement.scrollWidth>w+1)issues.push('Page overflow');if(!d.getElementById('error').hidden)issues.push('Game load error');if(state==='battle'){const note=d.getElementById('battle-note').getBoundingClientRect(),queue=d.getElementById('queue-row').getBoundingClientRect();if(note.bottom>queue.top&&note.top<queue.bottom)issues.push('Battle hint overlaps training queue');}return{width:w,height:h,state,issues};}
document.getElementById('check').onclick=()=>out.textContent=JSON.stringify(check('current'),null,2);
document.getElementById('run').onclick=async()=>{out.textContent='Checking layouts…';const d=f.contentDocument,results=[];try{for(const [w,h]of sizes){await fit(w,h);await delay();results.push(check('menu'));for(const id of ['campaign','forge','settings']){d.getElementById(id).click();await delay();results.push(check(id));d.querySelector('#'+id+'-screen [data-home]').click();}d.getElementById('skirmish').click();await delay();results.push(check('brief'));d.getElementById('begin').click();await delay();results.push(check('battle'));d.getElementById('pause').click();await delay();results.push(check('pause'));d.getElementById('leave').click();}const failed=results.filter(r=>r.issues.length);out.textContent=JSON.stringify({checks:results.length,passed:results.length-failed.length,failed,results},null,2);}catch(e){out.textContent=JSON.stringify({error:e.message,checks:results.length,results},null,2);}};
</script></body></html>
