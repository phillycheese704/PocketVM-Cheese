<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Isolated Pocket Browser mod QA</title><link rel="stylesheet" href="../styles.css"><style>body{background:#13223b}.qa-bar{display:flex;gap:8px;align-items:center;padding:10px;color:#dbe8ff;font:12px system-ui;flex-wrap:wrap}.qa-bar button,.qa-bar select{min-height:36px;padding:6px 12px;font:inherit}.qa-bar output{flex:1}.qa-window{position:relative;inset:auto!important;transform:none!important;width:calc(100% - 20px)!important;height:calc(100vh - 74px)!important;margin:0 10px}.qa-window .window-content{height:calc(100% - 46px)}#game-view{height:100%}#game-view iframe{width:100%;height:100%;border:0}</style></head><body><header class="qa-bar"><strong>Isolated test drive</strong><select id="test-game" aria-label="Game to test"><option value="flappy">Flappy Bird</option><option value="penguinpull">Penguin Pull</option><option value="apexrush">Apex Rush</option><option value="ballvsball">Ball vs Ball</option></select><button id="move">Move downloaded mod into game folder</button><button id="open-game">Open modded game</button><button id="show-browser">Show Pocket Browser</button><output id="status">Ready · no account or persistent drive is used.</output></header><section class="window focused qa-window"><header class="titlebar"><div class="window-title"><span class="window-icon">◎</span><span class="window-name">Pocket Browser</span></div></header><div id="browser" class="window-content"></div><div id="game-view" class="window-content" hidden></div></section><script>
// Test-only memory disk. Production Browser and Store code run unchanged.
const nodes=new Map(),values=new Map(),localMemory={getItem:k=>values.get(k)||null,setItem:(k,v)=>values.set(k,String(v)),removeItem:k=>values.delete(k)};Object.defineProperty(window,'localStorage',{value:localMemory});
const games={flappy:{name:'Flappy Bird',file:'flappy-featherweight.pvmod',id:'featherweight'},penguinpull:{name:'Penguin Pull',file:'penguin-moon-gravity.pvmod',id:'moongravity'},apexrush:{name:'Apex Rush',file:'apex-nitro-overdrive.pvmod',id:'nitrooverdrive'},ballvsball:{name:'Ball vs Ball',file:'ball-pinball-frenzy.pvmod',id:'pinballfrenzy'}};
const PocketDisk={formatBytes:n=>n+' B',ensureDir:async p=>nodes.set(p,{type:'dir'}),getNode:async p=>nodes.get(p),snapshot:async()=>Object.fromEntries(nodes),readText:async p=>{if(!nodes.has(p))throw Error('Missing file');return nodes.get(p).text},writeText:async(p,text)=>{nodes.set(p,{type:'file',text,size:new Blob([text]).size});dispatchEvent(new CustomEvent('pocketdiskchange',{detail:{path:p}}))},remove:async p=>{nodes.delete(p);dispatchEvent(new CustomEvent('pocketdiskchange',{detail:{path:p}}))}};window.PocketDisk=PocketDisk;
for(const [id,g]of Object.entries(games)){const names=id==='ballvsball'?['game.html','core.js','game.js','menu.mp3','battle.mp3','icon.png']:id==='apexrush'?['game.html','music.mp3','icon.png']:['game.html','icon.png'];for(const name of names)nodes.set('/home/user/Downloads/'+g.name+'/'+name,{type:'file',text:'Test installation marker',size:24})}
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)],escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),state={browserData:{bookmarks:[],history:[]}},saveJSON=()=>{},setWindowTitle=(w,t)=>document.querySelector('.window-name').textContent=t,notify=(title,text)=>document.getElementById('status').textContent=title+' · '+text,openApp=()=>{},ctx={state:{windows:new Map()},closeWindow(){},initDesktopGrid(){},refreshFS:async()=>{},notify,openApp};
const win={el:document.querySelector('.qa-window'),content:document.getElementById('browser')};
document.getElementById('move').onclick=async()=>{const game=document.getElementById('test-game').value,g=games[game],path='/home/user/Downloads/'+g.file;try{const text=await PocketDisk.readText(path);await PocketDisk.writeText('/home/user/Downloads/'+g.name+'/'+g.file,text);await PocketDisk.remove(path);notify('Moved',g.name+' / '+g.file)}catch(e){notify('Download the mod first',e.message)}};
document.getElementById('open-game').onclick=async()=>{const game=document.getElementById('test-game').value,g=games[game],mods=await PocketStoreApp.installedArcadeMods(game);if(!mods[g.id]){notify('Mod inactive','Download it in pocket:mods, then move it into the matching folder.');return}document.getElementById('browser').hidden=true;document.getElementById('game-view').hidden=false;document.getElementById('game-view').innerHTML='<iframe id="mod-game" title="Modded '+g.name+'" sandbox="allow-scripts" allow="autoplay" src="./mods-'+game+'-package.html?v=mods-v1"></iframe>';setWindowTitle(win,g.name+' · Mod QA')};
document.getElementById('show-browser').onclick=()=>{document.getElementById('game-view').innerHTML='';document.getElementById('game-view').hidden=true;document.getElementById('browser').hidden=false;setWindowTitle(win,'Pocket Browser')};
</script><script src="../store.js?v=102"></script><script src="./pocket-browser-under-test.js?v=mods-v1"></script><script>PocketStoreApp.init(ctx);buildWebBrowser(win);</script></body></html>
