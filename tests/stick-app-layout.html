<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stick War app layout checks</title><style>body{margin:14px;font:14px system-ui;background:#e5e1d3;color:#243329}header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}button,select{padding:10px;font:inherit}iframe{display:block;border:1px solid #899482;max-width:none}pre{white-space:pre-wrap;max-height:250px;overflow:auto}a{color:#243329}</style></head><body><header><strong>Stick War · real app package and shell</strong><select id="size" aria-label="App viewport"><option value="320,640">Small phone</option><option value="390,844">Phone portrait</option><option value="667,375">Small phone landscape</option><option value="844,390">Phone landscape</option><option value="768,1024">iPad portrait</option><option value="1024,768" selected>iPad landscape</option><option value="1366,768">Laptop</option></select><button id="run" disabled>Run app layouts</button><button id="check" disabled>Check current layout</button><button id="hide-results">Hide results</button></header><pre id="results">Loading the package created by the actual PocketVM Store builder…</pre><iframe id="app" title="PocketVM Stick War app viewport" src="./stick-app-frame.html?v=stick-v4" width="1024" height="768"></iframe><script>
const app=document.getElementById('app'),out=document.getElementById('results'),pending=new Map(),sizes=[[320,640],[360,740],[375,667],[390,844],[430,932],[568,320],[667,375],[740,360],[844,390],[932,430],[768,1024],[810,1080],[820,1180],[834,1194],[1024,768],[1080,810],[1180,820],[1194,834],[1280,720],[1366,768],[1440,900]];let serial=0;addEventListener('message',e=>{if(e.source!==app.contentWindow)return;if(e.data?.type==='stick-layout-ready'){document.getElementById('run').disabled=false;document.getElementById('check').disabled=false;out.textContent='Ready.';}if(e.data?.type==='stick-layout-error')out.textContent=e.data.error;if(e.data?.type==='stick-layout-result'){const p=pending.get(e.data.id);if(p){clearTimeout(p.timer);pending.delete(e.data.id);e.data.error?p.reject(Error(e.data.error)):p.resolve(e.data.result);}}});function request(action,state,more={}){return new Promise((resolve,reject)=>{const id=++serial,timer=setTimeout(()=>{pending.delete(id);reject(Error('App layout probe timed out'));},6000);pending.set(id,{resolve,reject,timer});app.contentWindow.postMessage({type:'stick-layout-request',id,action,state,...more},'*');});}const click=(target,state)=>request('click',state,{target}),delay=()=>new Promise(r=>setTimeout(r,200));document.getElementById('size').onchange=async e=>{[app.width,app.height]=e.target.value.split(',');await delay();out.textContent=JSON.stringify(await request('report','current'),null,2);};document.getElementById('check').onclick=async()=>out.textContent=JSON.stringify(await request('report','current'),null,2);
document.getElementById('hide-results').onclick=()=>{out.hidden=!out.hidden;document.getElementById('hide-results').textContent=out.hidden?'Show results':'Hide results';};document.getElementById('run').onclick=async()=>{const results=[];out.textContent='Checking actual sandboxed app layouts…';try{for(const [w,h]of sizes){app.width=w;app.height=h;await delay();results.push(await request('report','menu'));for(const target of ['campaign','forge','settings']){results.push(await click(target,target));await request('home');}results.push(await click('skirmish','brief'));results.push(await click('begin','battle'));results.push(await request('train','battle-queued'));results.push(await request('controls','control-basic'));results.push(await request('controls','control-special',{special:true}));results.push(await request('army','army-open'));results.push(await request('pause','pause'));await click('leave','menu');}const failed=results.filter(r=>r.issues.length);out.textContent=JSON.stringify({build:'stick-v4',checks:results.length,passed:results.length-failed.length,failed,results},null,2);}catch(error){out.textContent=JSON.stringify({error:error.message,checks:results.length,results},null,2);}};
</script></body></html>
