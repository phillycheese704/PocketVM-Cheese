<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fisch layout checks</title><style>body{font:14px system-ui;background:#dae6db;color:#193c43;margin:16px}header{display:flex;gap:12px;align-items:center;margin-bottom:12px;flex-wrap:wrap}button,select{padding:12px;font:inherit}iframe{display:block;border:1px solid #638e88;max-width:none}pre{white-space:pre-wrap}</style></head><body><header><strong>Fisch: Horizon · responsive QA</strong><select id="viewport" aria-label="Viewport"><option value="390,844">Phone portrait</option><option value="844,390">Phone landscape</option><option value="768,1024">iPad portrait</option><option value="1024,768">iPad landscape</option><option value="1366,768">Laptop</option></select><button id="check">Check visible layout</button><button id="run">Run all layout checks</button></header><pre id="results">Ready.</pre><iframe id="gameFrame" title="Fisch responsive test" width="390" height="844" src="../store/fisch/game.html?v=horizon-v1"></iframe><script>
const frame=document.getElementById('gameFrame'),sizes=document.getElementById('viewport'),out=document.getElementById('results'),results=[];
const sizesAll=[[320,640],[360,740],[375,667],[390,844],[430,932],[667,375],[740,360],[844,390],[932,430],[768,1024],[810,1080],[820,1180],[834,1194],[1024,768],[1080,810],[1180,820],[1194,834],[1280,720],[1366,768],[1440,900]];
const delay=()=>new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
function check(){const d=frame.contentDocument,w=frame.contentWindow.innerWidth,h=frame.contentWindow.innerHeight,issues=[],vis=e=>!!e.getBoundingClientRect().width&&!e.closest('[hidden]'),rect=e=>e.getBoundingClientRect();if(d.getElementById('error').hidden===false)issues.push('Game boot error');for(const id of ['cast','joystick','touch-boat','touch-use','touch-jump']){const e=d.getElementById(id);if(!vis(e))continue;const r=rect(e);if(r.left<0||r.top<0||r.right>w+.1||r.bottom>h+.1)issues.push(id+' outside viewport');if(r.width<44||r.height<44)issues.push(id+' too small');}
const a=rect(d.getElementById('cast')),b=rect(d.getElementById('joystick'));if(d.body.classList.contains('touch')&&a.left<b.right&&a.right>b.left&&a.top<b.bottom&&a.bottom>b.top)issues.push('Reel overlaps joystick');const overlay=d.getElementById('overlay');if(!overlay.hidden){const p=rect(d.querySelector('.panel'));if(p.left<0||p.top<0||p.right>w+.1||p.bottom>h+.1)issues.push('Panel outside viewport');const body=d.getElementById('panel-body');if(body.scrollWidth>body.clientWidth+2)issues.push('Panel content overflows horizontally');}if(d.documentElement.scrollWidth>w+1)issues.push('Page overflows horizontally');return{width:w,height:h,state:overlay.hidden?'play':d.getElementById('panel-title').textContent,issues};}
sizes.onchange=()=>{const [w,h]=sizes.value.split(',');frame.width=w;frame.height=h};document.getElementById('check').onclick=()=>{const result=check();out.textContent=JSON.stringify(result,null,2);};
document.getElementById('run').onclick=async()=>{results.length=0;const d=frame.contentDocument;d.getElementById('settings').click();const touch=d.getElementById('pref-touch');touch.value='on';touch.dispatchEvent(new frame.contentWindow.Event('change',{bubbles:true}));d.getElementById('close-panel').click();if(!d.getElementById('intro').hidden)d.getElementById('play').click();for(const [w,h]of sizesAll){frame.width=w;frame.height=h;await delay();results.push(check());for(const type of ['map','shop','journal','bag','quests']){d.querySelector('[data-panel="'+type+'"]').click();await delay();results.push(check());d.getElementById('close-panel').click();}}const issues=results.filter(x=>x.issues.length);out.textContent=JSON.stringify({checks:results.length,passed:results.length-issues.length,failed:issues,results},null,2);};
</script></body></html>
