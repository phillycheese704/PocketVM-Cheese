<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Stick War app viewport</title><link rel="stylesheet" href="../styles.css"><style>.test-taskbar{position:fixed;bottom:0;left:0;right:0;height:var(--taskbar-h);display:flex;align-items:center;padding:12px;background:#101b32;color:#c9d7e8;font:13px system-ui}</style></head><body><div class="desktop-wallpaper"></div><div class="window-layer"><section id="app-window" class="window maximized focused"><header class="titlebar"><div class="window-title"><span class="window-icon">⚑</span><span class="window-name">Stick War</span></div><div class="window-actions"><button disabled>−</button><button disabled>□</button><button disabled>×</button></div></header><div class="window-content"><div class="store-game-host"><iframe id="game" title="Stick War app" sandbox="allow-scripts" allow="autoplay; fullscreen; gamepad" allowfullscreen></iframe></div></div></section></div><footer class="test-taskbar">PocketVM · app viewport test</footer><script>
const game=document.getElementById('game');addEventListener('message',e=>{if(e.source===game.contentWindow&&['stick-layout-ready','stick-layout-result'].includes(e.data?.type))parent.postMessage(e.data,'*');if(e.source===parent&&e.data?.type==='stick-layout-request')game.contentWindow.postMessage(e.data,'*');});(async()=>{const [packageText,probe]=await Promise.all([fetch('./stick-app-package.html?v=stick-v4').then(r=>r.text()),fetch('./stick-layout-probe.js?v=stick-v4').then(r=>r.text())]);game.srcdoc=packageText.replace('</body>','<script>'+probe+'</'+'script></body>');})().catch(e=>parent.postMessage({type:'stick-layout-error',error:e.message},'*'));
</script></body></html>
