<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Apex Rush · tablet layout check</title><style>
*{box-sizing:border-box}body{margin:0;background:#122529;color:#f3eddb;font:14px system-ui;padding:18px}header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:14px}h1{font-size:18px;margin:0}select,button{font:inherit;background:#28453e;color:#ffe0b7;border:1px solid #63857b;border-radius:8px;padding:10px}#status{color:#a5d8c5;margin:10px 0;line-height:1.6}#stage{margin:auto;overflow:hidden;box-shadow:0 0 0 2px #54796f;border-radius:12px}iframe{display:block;border:0;transform-origin:top left}small{color:#a9c2ba}
</style></head><body><header><h1>Apex Rush · touch layout verification</h1><label>Viewport <select id="viewport"><option value="1024,768">iPad landscape · 1024 × 768</option><option value="768,1024">iPad portrait · 768 × 1024</option><option value="1366,1024">iPad Pro landscape · 1366 × 1024</option><option value="507,768">iPad split view · 507 × 768</option><option value="390,844">Phone portrait · 390 × 844</option><option value="740,390">Phone landscape · 740 × 390</option></select></label><button id="inspect">Check visible controls</button></header><small>Uses the shipped game inside a real, resizable iframe. Enable “Always show touch controls” in the garage, choose a size and start a race. No game state or inputs are simulated by this page.</small><p id="status" role="status">Choose a viewport, then configure and start a race below.</p><div id="stage"><iframe id="raceFrame" title="Apex Rush responsive race" src="../store/apexrush/game.html" allow="autoplay"></iframe></div><script>
const frame=document.getElementById('raceFrame'),stage=document.getElementById('stage'),status=document.getElementById('status');
function resize(){const [w,h]=document.getElementById('viewport').value.split(',').map(Number),scale=Math.min(1,(innerWidth-36)/w,Math.max(300,innerHeight-150)/h);frame.style.width=w+'px';frame.style.height=h+'px';frame.style.transform='scale('+scale+')';stage.style.width=w*scale+'px';stage.style.height=h*scale+'px'}
document.getElementById('viewport').onchange=()=>{resize();status.textContent='Viewport changed. Check portrait or landscape controls below.'};addEventListener('resize',resize);resize();
document.getElementById('inspect').onclick=()=>{const d=frame.contentDocument,w=frame.contentWindow.innerWidth,h=frame.contentWindow.innerHeight,buttons=[...d.querySelectorAll('[data-control]')];if(d.getElementById('touch').hidden||getComputedStyle(d.getElementById('touch')).display==='none'){status.textContent='Start a race with touch controls visible before checking.';return}const bounds=buttons.map(b=>({name:b.dataset.control,r:b.getBoundingClientRect()})),outside=bounds.filter(({r})=>r.left<0||r.top<0||r.right>w+1||r.bottom>h+1),small=bounds.filter(({r})=>r.width<44||r.height<44),overlap=bounds.some((a,i)=>bounds.slice(i+1).some(b=>a.r.left<b.r.right-1&&a.r.right>b.r.left+1&&a.r.top<b.r.bottom-1&&a.r.bottom>b.r.top+1));status.textContent=(!outside.length&&!small.length&&!overlap?'PASS':'FAIL')+' · '+w+' × '+h+' · '+bounds.map(b=>b.name+' '+Math.round(b.r.width)+'×'+Math.round(b.r.height)).join(', ')+' · '+outside.length+' outside, '+small.length+' undersized, '+(overlap?'overlap':'no overlaps')};
</script></body></html>
